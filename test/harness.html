<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glasshouse Stat Card harness</title>
<!--
  Offline test harness. Open directly from disk:
    harness.html            desktop layout (12-column sections grid, ~1200px)
    harness.html?w=390      phone layout (single column)
    harness.html?preview=1  curated layout used for docs/preview.png
  Optional: put an mdi-paths.js next to this file (window.__MDI = {"mdi:name": "<svg path>"})
  to draw real Material Design Icons; see test/gen-mdi.js. Without it the stubs draw labelled glyphs.
  All entities, names and data below are synthetic.
-->
<style>
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 600px at 10% -5%, rgba(88,166,255,.16), transparent 60%),
      radial-gradient(800px 600px at 95% 25%, rgba(196,140,255,.12), transparent 60%),
      radial-gradient(700px 500px at 40% 100%, rgba(246,211,101,.08), transparent 60%),
      #0b0e13;
    color: #e9eef6;
    font-family: -apple-system, "SF Pro Text", Inter, Roboto, system-ui, sans-serif;
  }
  .page { box-sizing: border-box; margin: 0 auto; padding: 20px 16px 28px; }
  h1 { font-size: 13px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: #5d697d; margin: 0 4px 14px; }
  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; align-items: start; }
  .phone { margin: 0 !important; }
  .phone .grid { grid-template-columns: minmax(0, 1fr); }
  .phone .slot { grid-column: 1 / -1 !important; }
  .cap { font: 500 10px/1 ui-monospace, Menlo, monospace; color: #5d697d; margin: 0 0 5px 6px; }
</style>
<script src="mdi-paths.js" onerror="window.__MDI = window.__MDI || null"></script>
<script src="../glasshouse-stat-card.js"></script>
</head>
<body>
<div class="page" id="page"><h1 id="h"></h1><div class="grid" id="grid"></div></div>

<script>
// ---------------- stubs for HA elements ----------------
const GLYPHS = {};
function iconSvg(name) {
  const p = window.__MDI && window.__MDI[name];
  if (p) return `<svg viewBox="0 0 24 24" width="100%" height="100%" style="display:block;fill:currentColor"><path d="${p}"/></svg>`;
  const g = (name || '?').replace('mdi:', '').slice(0, 2).toUpperCase();
  return `<span style="font:700 9px/1 system-ui;letter-spacing:-.02em">${g}</span>`;
}
class StubIcon extends HTMLElement {
  static get observedAttributes() { return ['icon']; }
  connectedCallback() { this.draw(); }
  attributeChangedCallback() { this.draw(); }
  set icon(v) { this.setAttribute('icon', v); }
  draw(name = this.getAttribute('icon')) {
    this.style.cssText = 'display:inline-flex;align-items:center;justify-content:center;width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px)';
    this.innerHTML = iconSvg(name);
  }
}
class StubStateIcon extends StubIcon {
  set stateObj(st) { this._st = st; this.draw(this.pick()); }
  set hass(h) { this._hass = h; }
  connectedCallback() { this.draw(this.pick()); }
  pick() {
    const st = this._st;
    if (!st) return 'mdi:help-circle-outline';
    if (st.attributes.icon) return st.attributes.icon;
    const dc = st.attributes.device_class;
    const map = { temperature: 'mdi:thermometer', humidity: 'mdi:water-percent', power: 'mdi:flash', voltage: 'mdi:sine-wave', door: st.state === 'on' ? 'mdi:door-open' : 'mdi:door-closed', monetary: 'mdi:cash' };
    return map[dc] || 'mdi:gauge';
  }
}
customElements.define('ha-card', class extends HTMLElement {});
customElements.define('ha-icon', StubIcon);
customElements.define('ha-state-icon', StubStateIcon);

// ---------------- synthetic data ----------------
const NOW = Date.now();
const H = 3600e3, M = 60e3;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hourOf = (t) => { const d = new Date(t); return d.getHours() + d.getMinutes() / 60; };
const inWin = (h, a, b) => (a <= b ? h >= a && h < b : h >= a || h < b);

// series(id) -> [{t, s}] ascending, oldest a little older than 8 days
function make(stepMin, fn, seed, days = 8) {
  const r = rng(seed); const out = [];
  for (let t = NOW - days * 24 * H; t <= NOW; t += stepMin * M * (0.6 + r() * 0.8)) {
    const v = fn(t, r); out.push({ t: Math.round(t), s: v == null ? 'unavailable' : String(v) });
  }
  return out;
}
const SERIES = {
  'sensor.house_power': make(2, (t, r) => {
    const h = hourOf(t); let w = 340 + (r() < 0.5 ? 90 : 0) + r() * 40;
    if (inWin(h, 7.0, 7.2)) w += 1900;
    if (inWin(h, 12.5, 16)) w += 1500 + r() * 500;
    if (inWin(h, 17.4, 18.6)) w += 3100 + r() * 400;
    if (inWin(h, 20, 21.1)) w += 2300;
    return Math.round(w);
  }, 1),
  'sensor.living_temperature': make(5, (t, r) => (21.2 + 1.9 * Math.sin(((hourOf(t) - 9) / 24) * 2 * Math.PI) + (r() - 0.5) * 0.12).toFixed(1), 2),
  'sensor.living_humidity': make(6, (t, r) => (47 - 5 * Math.sin(((hourOf(t) - 7) / 24) * 2 * Math.PI) + (r() - 0.5) * 1.2).toFixed(0), 3),
  'sensor.grid_voltage': [{ t: NOW - 9 * 24 * H, s: '240.0' }],
  'sensor.wan_download': make(4, (t, r) => {
    const ago = (NOW - t) / H;
    if ((ago > 14.2 && ago < 15.1) || (ago > 5.4 && ago < 6.0)) return null;
    const h = hourOf(t); const base = inWin(h, 19, 23.5) ? 520 : 840;
    return Math.round(base + (r() - 0.5) * 160);
  }, 4),
  'sensor.printer_progress': make(5, (t) => {
    const ago = (NOW - t) / H;
    if (ago < 1.8) return null;
    if (ago > 8.5) return 0;
    return Math.min(100, Math.round(((8.5 - ago) / 6.5) * 100));
  }, 5),
  'sensor.stock_price': (() => { let p = 182.4; return make(10, (t, r) => { const ago = (NOW - t) / H; if (ago < 24) p += (r() - 0.58) * 0.9; else p += (r() - 0.5) * 0.8; return p.toFixed(2); }, 6); })(),
  'sensor.solar_power': make(5, (t, r) => {
    const h = hourOf(t); if (h < 6.8 || h > 17.6) return 0;
    let w = 4800 * Math.sin(((h - 6.8) / 10.8) * Math.PI);
    if (inWin(h, 11, 12.3)) w *= 0.55 + r() * 0.2;
    return Math.max(0, Math.round(w + (r() - 0.5) * 120));
  }, 7),
  'sensor.water_flow': make(3, (t, r) => {
    const h = hourOf(t);
    if (inWin(h, 6.5, 7.3) || inWin(h, 19.5, 20.2)) return (6 + r() * 5).toFixed(1);
    if (inWin(h, 4, 4.6)) return (14 + r() * 3).toFixed(1); // irrigation
    return r() < 0.06 ? (2 + r() * 4).toFixed(1) : '0.0';
  }, 8),
  'sensor.server_cpu_temp': make(3, (t, r) => (58 + 8 * Math.max(0, Math.sin(((hourOf(t) - 10) / 24) * 2 * Math.PI)) + (NOW - t < 1.5 * H ? 9 : 0) + (r() - 0.5) * 2).toFixed(1), 9),
  'sensor.nas_disk_used': make(30, (t) => (78.2 + (1 - (NOW - t) / (8 * 24 * H)) * 5).toFixed(1), 10),
  'sensor.house_battery': make(5, (t) => { const h = hourOf(t); const v = 30 + 60 * Math.max(0, Math.sin(((h - 8) / 16) * Math.PI)); return v.toFixed(0); }, 11),
  'sensor.outdoor_temperature': make(15, (t, r) => (14 + 6 * Math.sin(((hourOf(t) - 9) / 24) * 2 * Math.PI) + 3 * Math.sin((t / (24 * H)) * 0.9) + (r() - 0.5) * 0.4).toFixed(1), 12),
  'binary_sensor.front_door': (() => {
    const out = [{ t: NOW - 9 * 24 * H, s: 'off' }];
    [[-22.3, 0.05], [-19.1, 0.3], [-13.6, 0.08], [-10.2, 0.6], [-7.4, 0.1], [-4.2, 0.02], [-2.9, 0.4], [-0.78, 0.04]]
      .forEach(([a, d]) => { out.push({ t: NOW + a * H, s: 'on' }, { t: NOW + (a + d) * H, s: 'off' }); });
    out.push({ t: NOW - 16.5 * H, s: 'unavailable' }, { t: NOW - 16.1 * H, s: 'off' });
    return out.sort((x, y) => x.t - y.t);
  })(),
  'sensor.washer_state': [
    { t: NOW - 30 * H, s: 'idle' }, { t: NOW - 9 * H, s: 'washing' }, { t: NOW - 8.1 * H, s: 'rinse' },
    { t: NOW - 7.6 * H, s: 'spin' }, { t: NOW - 7.3 * H, s: 'idle' }, { t: NOW - 1.4 * H, s: 'washing' },
  ],
};
// Pin a few current values so threshold colours are deterministic.
const pin = (id, v) => { const a = SERIES[id]; a.push({ t: NOW - 40 * 1000, s: String(v) }); };
pin('sensor.house_power', 3420);
pin('sensor.server_cpu_temp', 74.6);
pin('sensor.nas_disk_used', 83.1);
pin('sensor.house_battery', 64);

const ATTR = {
  'sensor.house_power': { friendly_name: 'House power', unit_of_measurement: 'W', device_class: 'power', state_class: 'measurement' },
  'sensor.energy_today': { friendly_name: 'Energy today', unit_of_measurement: 'kWh', device_class: 'energy' },
  'sensor.living_temperature': { friendly_name: 'Living room', unit_of_measurement: '°C', device_class: 'temperature', state_class: 'measurement' },
  'sensor.living_humidity': { friendly_name: 'Living humidity', unit_of_measurement: '%', device_class: 'humidity' },
  'sensor.grid_voltage': { friendly_name: 'Grid voltage', unit_of_measurement: 'V', device_class: 'voltage' },
  'sensor.wan_download': { friendly_name: 'WAN download', unit_of_measurement: 'Mbit/s', icon: 'mdi:download-network' },
  'sensor.printer_progress': { friendly_name: 'Printer progress', unit_of_measurement: '%' },
  'sensor.stock_price': { friendly_name: 'Ticker', unit_of_measurement: 'USD', device_class: 'monetary' },
  'sensor.solar_power': { friendly_name: 'Solar', unit_of_measurement: 'W', device_class: 'power' },
  'sensor.solar_today': { friendly_name: 'Solar today', unit_of_measurement: 'kWh' },
  'sensor.water_flow': { friendly_name: 'Water flow', unit_of_measurement: 'L/min' },
  'sensor.water_today': { friendly_name: 'Water today', unit_of_measurement: 'L' },
  'sensor.server_cpu_temp': { friendly_name: 'Server CPU', unit_of_measurement: '°C', device_class: 'temperature' },
  'sensor.nas_disk_used': { friendly_name: 'NAS disk', unit_of_measurement: '%' },
  'sensor.house_battery': { friendly_name: 'Battery', unit_of_measurement: '%', device_class: 'battery' },
  'sensor.outdoor_temperature': { friendly_name: 'Outdoor', unit_of_measurement: '°C', device_class: 'temperature' },
  'binary_sensor.front_door': { friendly_name: 'Front door', device_class: 'door' },
  'sensor.washer_state': { friendly_name: 'Washer', icon: 'mdi:water-pump' },
};
const EXTRA = { 'sensor.energy_today': '18.43', 'sensor.solar_today': '21.7', 'sensor.water_today': '412' };

function stateObj(id, s, t) {
  const iso = new Date(t).toISOString();
  return { entity_id: id, state: s, attributes: ATTR[id] || {}, last_changed: iso, last_updated: iso, context: {} };
}
const states = {};
Object.entries(SERIES).forEach(([id, a]) => {
  const last = a[a.length - 1];
  let lc = last.t; for (let k = a.length - 2; k >= 0 && a[k].s === last.s; k--) lc = a[k].t;
  states[id] = stateObj(id, last.s, last.t); states[id].last_changed = new Date(lc).toISOString();
});
Object.entries(EXTRA).forEach(([id, v]) => { states[id] = stateObj(id, v, NOW - 5 * M); });

let wsCalls = 0;
const hass = {
  states,
  entities: { 'sensor.living_temperature': { display_precision: 1 }, 'sensor.stock_price': { display_precision: 2 } },
  locale: { language: 'en-US' },
  language: 'en',
  callService: async () => {},
  callWS: async (msg) => {
    wsCalls++;
    if (msg.type !== 'history/history_during_period') throw new Error('unexpected ' + msg.type);
    const start = Date.parse(msg.start_time), end = Date.parse(msg.end_time);
    const res = {};
    msg.entity_ids.forEach((id) => {
      const a = SERIES[id]; if (!a) return;
      const rows = []; let held = null;
      a.forEach((x) => {
        if (x.t <= start) { held = x; return; }
        if (x.t > end) return;
        if (rows.length && rows[rows.length - 1].s === x.s) return; // HA records changes only
        rows.push({ s: x.s, lu: x.t / 1000 });
      });
      if (held) rows.unshift({ s: held.s, lu: start / 1000 });
      res[id] = rows;
    });
    await new Promise((r) => setTimeout(r, 60));
    return res;
  },
};

// ---------------- variants ----------------
const params = new URLSearchParams(location.search);
const PHONE = params.get('w') ? +params.get('w') : 0;
const PREVIEW = params.has('preview');

const V = {
  power: { title: 'Energy', stats: [{ entity: 'sensor.house_power', name: 'House', icon: 'mdi:home-lightning-bolt', accent: 'energy', decimals: 0, trend: 'inverse',
    thresholds: [{ above: 3000, color: 'warn' }, { above: 6000, color: 'alert' }], secondary: 'sensor.energy_today', secondary_label: 'Today' }] },
  temp: { stats: [{ entity: 'sensor.living_temperature', icon: 'mdi:thermometer', accent: 'heat', secondary: 'sensor.living_humidity', secondary_label: 'Humidity' }] },
  net: { stats: [{ entity: 'sensor.wan_download', name: 'Download', accent: 'info', extrema: true }] },
  grid4: { title: 'Climate & energy', stats: [
    { entity: 'sensor.house_power', name: 'House', icon: 'mdi:home-lightning-bolt', accent: 'energy', trend: 'inverse', thresholds: [{ above: 3000, color: 'warn' }, { above: 6000, color: 'alert' }] },
    { entity: 'sensor.living_temperature', name: 'Living', icon: 'mdi:thermometer', accent: 'heat' },
    { entity: 'sensor.living_humidity', name: 'Humidity', icon: 'mdi:water-percent', accent: 'water', trend: 'neutral' },
    { entity: 'sensor.grid_voltage', name: 'Grid', icon: 'mdi:sine-wave', accent: 'neutral' },
  ] },
  bars: { title: 'Production & usage', stats: [
    { entity: 'sensor.solar_power', name: 'Solar', icon: 'mdi:solar-power-variant', accent: 'energy', graph: 'bar', secondary: 'sensor.solar_today', secondary_label: 'Today' },
    { entity: 'sensor.water_flow', name: 'Water', icon: 'mdi:water', accent: 'water', graph: 'bar', trend: 'neutral', secondary: 'sensor.water_today', secondary_label: 'Today' },
  ] },
  mixed: { title: 'Around the house', columns: 2, stats: [
    { entity: 'sensor.stock_price', name: 'Ticker', icon: 'mdi:finance', accent: 'media' },
    { entity: 'sensor.printer_progress', name: 'Printer', icon: 'mdi:printer-3d-nozzle', accent: 'cover' },
    { entity: 'binary_sensor.front_door', accent: 'security' },
    { entity: 'sensor.does_not_exist', name: 'Garage temp', icon: 'mdi:thermometer' },
  ] },
  thresholds: { title: 'Server', stats: [
    { entity: 'sensor.server_cpu_temp', name: 'CPU', icon: 'mdi:thermometer', accent: 'cool', trend: 'inverse', thresholds: [{ above: 65, color: 'warn' }, { above: 70, color: 'alert' }] },
    { entity: 'sensor.nas_disk_used', name: 'Disk', icon: 'mdi:gauge', accent: 'info', trend: 'inverse', thresholds: [{ above: 80, color: 'warn' }, { above: 92, color: 'alert' }] },
    { entity: 'sensor.house_battery', name: 'Battery', icon: 'mdi:battery-high', accent: 'switch', thresholds: [{ below: 20, color: 'alert' }, { above: 50, color: 'ok' }] },
  ] },
  week: { title: 'Outdoor · 7 days', hours: 168, stats: [{ entity: 'sensor.outdoor_temperature', icon: 'mdi:home-thermometer', accent: 'cool', extrema: true }] },
  door: { stats: [{ entity: 'binary_sensor.front_door', accent: 'security' }] },
  washer: { stats: [{ entity: 'sensor.washer_state', accent: 'media', graph: 'none' }] },
};
let layout;
if (PREVIEW) {
  layout = [['power', 4], ['temp', 4], ['net', 4], ['grid4', 12], ['bars', 6], ['thresholds', 6]];
} else {
  layout = [['power', 4], ['temp', 4], ['net', 4], ['grid4', 12], ['bars', 6], ['mixed', 6], ['thresholds', 6], ['week', 3], ['door', 3], ['washer', 3]];
}
const page = document.getElementById('page');
page.style.width = PHONE ? `${PHONE}px` : '1200px';
if (PHONE) page.classList.add('phone');
document.getElementById('h').textContent = PREVIEW ? '' : `glasshouse-stat-card · ${PHONE ? PHONE + 'px' : 'desktop'}`;
if (PREVIEW) document.getElementById('h').remove();
const grid = document.getElementById('grid');
const cards = [];
for (const [key, span] of layout) {
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.style.gridColumn = `span ${span}`;
  if (!PREVIEW) { const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = key; slot.appendChild(cap); }
  const card = document.createElement('glasshouse-stat-card');
  try { card.setConfig(V[key]); } catch (e) { slot.textContent = 'config error: ' + e.message; }
  slot.appendChild(card); grid.appendChild(slot);
  card.hass = hass;
  cards.push(card);
}
// Config validation smoke tests.
const bad = [{}, { stats: [] }, { stats: [{ entity: 'nope' }] }, { stats: [{ entity: 'sensor.x', graph: 'pie' }] }, { stats: [{ entity: 'sensor.x', thresholds: [{ color: 'warn' }] }] }, { stats: [{ entity: 'sensor.x', tap_action: 'navigate' }] }];
window.__badOk = bad.every((c) => { try { document.createElement('glasshouse-stat-card').setConfig(c); return false; } catch (e) { return true; } });
// Live update after history: new state object for house power must append, not refetch.
setTimeout(() => {
  const t = Date.now();
  const ns = { ...states['sensor.house_power'], state: '3460', last_changed: new Date(t).toISOString(), last_updated: new Date(t).toISOString() };
  const next = { ...hass, states: { ...hass.states, 'sensor.house_power': ns } };
  cards.forEach((c) => { c.hass = next; });
  // Simulated mouse hover on the "net" card graph to exercise the scrub readout.
  if (!PREVIEW && !PHONE) {
    const net = cards[layout.findIndex((l) => l[0] === 'net')];
    const plot = net.shadowRoot.querySelector('.graph .plot');
    const r = plot.getBoundingClientRect();
    plot.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, composed: true, pointerType: 'mouse', clientX: r.left + r.width * 0.62, clientY: r.top + r.height / 2 }));
  }
  setTimeout(() => {
    document.title = `ws=${wsCalls} badOk=${window.__badOk} grid=${cards[0].getGridOptions().columns}/${cards[3].getGridOptions().columns}`;
    console.log(document.title);
  }, 100);
}, 800);
</script>
</body>
</html>
